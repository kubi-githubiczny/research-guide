<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interview Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{margin:0}

/* Layout: a charcoal frame holding a warm grey canvas; light-weight type, white pill controls, thin connector lines and a lime marker for "here and now". */
:root{
  --frame:#3A3A38; --frame-ink:#F1F0EB;
  --bg:#DEDCD5; --surface:#ECEBE6; --white:#FFFFFF; --sunk:#E3E1DB; --ink:#1D1D1B; --muted:#55534D; --line:#C4C2BA;
  --accent:#E6F03C; --accent-2:#E6F03C; --accent-ink:#1D1D1B; --accent-soft:#F2F6BE;
  --pill:#2B2B29; --pill-ink:#F7F7F2;
  --tip:#E3E1DB; --tip-ink:#3B3A36; --ok:#2E7D4F; --ok-soft:#DCEBD9; --warn:#C24E22; --warn-soft:#F3DFD4;
  --display:"Manrope", "Helvetica Neue", Arial, sans-serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:26px; --r-s:16px;
  --shadow:none;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar: three floating white capsules */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:14px;max-width:2000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 18px 6px 6px;min-width:0}
.mark{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand span.sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tabs{display:flex;gap:2px;background:var(--surface);padding:5px;border-radius:999px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--pill);color:var(--pill-ink)}
.timer{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:5px 5px 5px 18px}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;min-width:4.4ch;text-align:right;letter-spacing:-.01em}
.btn{border:0;background:var(--sunk);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--pill);color:var(--pill-ink)}
.btn.primary:hover{opacity:.88}
.timer .btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:6px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

main{max-width:1440px;margin:0 auto;padding-block:8px 60px}
.view{display:block}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--muted)}
.lede{color:var(--muted);max-width:65ch;margin:6px 0 0}
.panel{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:20px}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
label.lab,.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:var(--r-s);padding:10px 14px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.req{color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-s);background:var(--sunk);margin-bottom:8px}
.check input{margin-top:3px;accent-color:var(--ink);width:17px;height:17px;flex:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}

/* interview layout */
.iv{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;gap:16px;align-items:start;margin-top:4px}
@media (max-width:1180px){.iv{grid-template-columns:210px minmax(0,1fr)}.capture{grid-column:1/-1}}
@media (max-width:760px){.iv{grid-template-columns:1fr}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,76px));display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.stage-btn{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;border:0;background:var(--surface);border-radius:20px;padding:14px 16px;cursor:pointer;min-width:0}
@media (max-width:760px){.stage-btn{min-width:180px}}
.stage-btn:hover{background:var(--sunk)}
.stage-btn .n{grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700}
.stage-btn .t{font-weight:600;font-size:14px;line-height:1.25}
.stage-btn .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-btn .m.over{color:var(--warn);font-weight:600}
.meter{grid-column:1/-1;height:6px;background:repeating-linear-gradient(-45deg,var(--sunk) 0 4px,var(--line) 4px 6px);border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:6px}
.stage-btn[aria-current="step"]{background:var(--accent);color:var(--accent-ink)}
.stage-btn[aria-current="step"] .n{background:rgba(0,0,0,.08);color:var(--accent-ink)}
.stage-btn[aria-current="step"] .m{color:rgba(0,0,0,.6)}
.stage-btn[aria-current="step"] .meter{background:rgba(0,0,0,.12)}
.stage-btn[aria-current="step"] .meter i{background:#fff}
.rail > .btn{border-radius:20px;padding:13px 16px;background:var(--pill);color:var(--pill-ink)}

.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-end;margin-bottom:16px;padding:4px 4px 0}
.goal{color:var(--muted);margin:6px 0 0;max-width:65ch}
.script{background:var(--surface);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.script p{margin:0 0 10px;max-width:75ch}
.script p:last-child{margin:0}
.es{font-style:italic;color:var(--muted)}
.prompt{background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);border:1.5px solid transparent}
.prompt.done{border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.p-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:18px 20px 14px;align-items:start}
.p-id{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--sunk);border-radius:999px;padding:4px 10px;white-space:nowrap}
.p-q{font-weight:600;font-size:16.5px;line-height:1.4;margin:0;letter-spacing:-.005em}
.p-es{margin:5px 0 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.star{background:var(--accent-soft);color:var(--accent)}
.asked{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;padding:6px 12px;background:var(--sunk);border-radius:999px;user-select:none}
.asked input{accent-color:var(--ok);width:15px;height:15px;margin:0}
.prompt.done .asked{background:var(--ok-soft);color:var(--ok)}
.p-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:16px;padding:0 20px 20px}
@media (max-width:980px){.p-body{grid-template-columns:1fr}}
.probe{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.probe b{color:var(--ink);font-weight:600}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:var(--r-s);padding:10px 12px;font-size:13px;line-height:1.45}
.tip.live{background:var(--accent-soft);color:var(--warn)}
.tip b{font-weight:700}
#stageWarn{background:var(--accent-soft);color:var(--warn);margin-bottom:12px}
.callout{background:var(--surface);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.callout .line{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin:10px 0;padding:10px 14px;background:var(--accent-soft);border-radius:var(--r-s);overflow-x:auto;white-space:nowrap}
.subhead{margin:22px 4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.stage-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* capture */
.capture{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,76px))}
@media (max-width:1180px){.capture{position:static}}
.cap-in{display:flex;flex-direction:column;gap:12px}
.cap-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cap-btns .btn{padding:8px 6px}
.cap-btns .btn[data-cap="quote"]{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink)}
.log{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13.5px;padding:10px 12px;border-radius:var(--r-s);background:var(--sunk)}
.entry .ts{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:1px}
.entry .k{font-size:11px;font-weight:600;color:var(--accent);display:block}
.entry p{margin:0;word-break:break-word}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;padding:2px 4px}
.empty{color:var(--muted);font-size:13.5px;margin:0}

/* review */
.review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px}
@media (max-width:900px){.review{grid-template-columns:1fr}}
.cov{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:12px 14px;align-items:center;font-size:14px}
.bar-t{height:14px;background:repeating-linear-gradient(-45deg,var(--accent-soft) 0 5px,color-mix(in srgb,var(--accent) 35%,var(--surface)) 5px 7px);border-radius:6px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--ink);border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
.sugg{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sugg li{background:var(--sunk);color:var(--tip-ink);padding:12px 14px;border-radius:var(--r-s);font-size:14px;position:relative;padding-left:30px}
.sugg li::before{content:"";position:absolute;left:14px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hyp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.hyp:last-child{border-bottom:0}
.hyp .hid{font-weight:700;font-size:12.5px;background:var(--sunk);border-radius:999px;padding:3px 10px;height:max-content}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:var(--r-s);padding:14px;max-height:420px;overflow:auto;margin:0;font-family:var(--body)}
.status{font-size:13.5px;color:var(--muted);min-height:1.4em;margin:0}
.status.ok{color:var(--ok)} .status.err{color:var(--warn)}
#saveBtn{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink)}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card h3{font-size:17px}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:var(--sunk);border-radius:999px;padding:2px 10px}
.banner{background:var(--surface);border-radius:var(--r);padding:18px 20px;font-size:14px;color:var(--muted);margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pill);color:var(--pill-ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.prompt,.stage-btn,.tab,.btn{transition:border-color .15s,background .15s,opacity .15s}}

/* ---- timeline navigator ---- */
.tl-card{background:var(--surface);border-radius:var(--r);padding:16px 20px 10px;box-shadow:var(--shadow);margin-bottom:16px}
@media (min-width:900px){.tl-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,76px));z-index:4;box-shadow:0 6px 20px rgba(20,20,30,.06)}}
.tl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:10px}
.tl-pace{font-size:13.5px;padding:6px 14px;border-radius:999px;background:var(--sunk)}
.tl-pace.ok{background:var(--ok-soft);color:var(--ok)}
.tl-pace.late{background:var(--accent-soft);color:var(--warn)}
.tl-pace.early{background:var(--sunk);color:var(--ink)}
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:10px;height:10px;border-radius:50%;border:2px solid #A9A79F;background:var(--surface);display:inline-block}
.lg.done{background:var(--ink);border-color:var(--ink)}
.lg.star{border-color:var(--accent)}
.lg.act{border-radius:3px}
.lg.now{width:3px;height:12px;border:0;border-radius:2px;background:var(--accent)}
.tl-scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
.tl{position:relative;min-width:980px;padding:0 14px}
.tl-segs{position:relative;height:50px}
.tl-seg{position:absolute;top:0;height:46px;border:0;border-radius:14px;background:var(--sunk);text-align:left;padding:6px 10px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px var(--surface)}
.tl-seg:hover{background:var(--line)}
.tl-seg.cur{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink)}
.tl-sn{grid-row:1/3;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.tl-st{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-sm{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-seg.cur .tl-sm{color:rgba(0,0,0,.6)}
.tl-sm.over{color:var(--warn);font-weight:700}
.tl-seg.cur .tl-sm.over{color:var(--accent-ink);text-decoration:underline}
.tl-track{position:relative;height:78px}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:38px;height:6px;border-radius:6px;background:repeating-linear-gradient(-45deg,var(--sunk) 0 5px,#DADAE0 5px 7px)}
.tl-fill{position:absolute;left:0;top:38px;height:6px;border-radius:6px;background:var(--ink);width:0}
.tl-dot{position:absolute;top:24px;transform:translateX(-50%);border:0;background:transparent;padding:0;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;z-index:2}
.tl-dot i{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2.5px solid #A9A79F;display:block;transition:transform .12s}
.tl-dot.act i{border-radius:5px;width:13px;height:13px}
.tl-dot.star i{border-color:var(--accent)}
.tl-dot.done i{background:var(--ink);border-color:var(--ink)}
.tl-dot:hover i{transform:scale(1.25)}
.tl-dot.cur i{width:24px;height:24px;background:linear-gradient(135deg,var(--accent-2),var(--accent));border:4px solid var(--surface);box-shadow:0 0 0 2px var(--accent),0 4px 12px rgba(0,0,0,.18)}
.tl-dot.cur.act i{border-radius:7px}
.tl-id{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.tl-dot.cur .tl-id{color:var(--accent);font-size:11.5px}
.tl-stop{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:4px}
.tl-stop.lo{top:44px}
.tl-now{position:absolute;top:6px;bottom:4px;width:2px;background:var(--accent);left:0;transform:translateX(-1px);z-index:3;pointer-events:none}
.tl-now span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px;white-space:nowrap}
.tl-ticks{position:relative;height:20px;margin-top:4px}
.tl-tick{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- focus + lists ---- */
.iv2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1100px){.iv2{grid-template-columns:1fr}.capture{position:static}}
.capture{top:calc(env(safe-area-inset-top,0px) + var(--hdr,76px) + 236px)}
.focus{padding:22px 24px}
.focus-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start;margin-bottom:14px}
.focus-top .goal{margin-top:4px;font-size:13.5px}
.focus-body{display:flex;flex-direction:column;gap:14px}
.focus-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.focus-meta .asked{margin-left:auto}
.chip.stop{background:var(--ink);color:var(--surface)}
.focus-q{font-family:var(--display);font-size:clamp(20px,2.2vw,26px);font-weight:600;line-height:1.3;letter-spacing:-.015em;margin:0;max-width:40ch}
.focus-es{font-size:16px;margin:-6px 0 0;max-width:60ch}
.focus-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.focus-grid{grid-template-columns:1fr}}
.probe-box{background:var(--sunk);border-radius:var(--r-s);padding:12px 14px}
.probe-box p{margin:4px 0 0;font-size:14px}
.prompt-focus.done .asked{background:var(--ok-soft);color:var(--ok)}

/* ---------------- guide content ---------------- */

  { id:"s1", n:"1", title:"Warm-up & Rapport", plan:5,

/* ---------------- tips engine ---------------- */
function liveTips(text){
  const t=(text||"").toLowerCase(), out=[];
  if(/\b(usually|always|normally|generally|typically|would|siempre|normalmente|suelo|solemos|en general)\b/.test(t))
    out.push("<b>Generalising.</b> Bring them back: “Tell me about the last time that happened.”");
  if(/no time|not enough time|too busy|no tengo tiempo|sin tiempo|muy ocupad/.test(t))
    out.push("<b>“No time” heard.</b> Ladder it: “What did you mean by no time? What happened that week?”");
  if(/expensive|price|cost|money|caro|precio|dinero|pagar/.test(t))
    out.push("<b>Money came up.</b> Ask who paid and how they decided it was worth it, without saying “expensive”.");
  if(/certificat|diploma|t[ií]tulo|degree|credential/.test(t))
    out.push("<b>Credentials mentioned.</b> Ask: “When did anyone last ask to see it?” (RQ4, H3)");
  if(/\b(ai|chatgpt|claude|gpt|ia|youtube|tutorial)\b/.test(t))
    out.push("<b>Informal or AI learning.</b> Ask them to show it, and how they knew the answer was good enough.");
  if(/boss|manager|company|empresa|jefe|cliente|client/.test(t))
    out.push("<b>Employer or client involved.</b> Probe support: time, budget, recognition.");
  if(/drop|quit|stopped|gave up|dej[eé]|abandon/.test(t))
    out.push("<b>Dropout story.</b> Pin the moment: “What was going on at work or at home that week?”");
  return out.slice(0,3);
}
function renderLive(id){
  const box=document.getElementById("live-"+id); if(!box) return;
  const p=P(id), tips=liveTips(p.note);
  if(p.asked && (p.note||"").trim().length>0 && (p.note||"").trim().length<40) tips.push("<b>Short answer.</b> Try the 5-second silence, then “Tell me more about that…”");
  box.innerHTML=tips.map(t=>`<div class="tip live">${t}</div>`).join("");
}

/* ---------------- coverage & suggestions ---------------- */
function coverage(){
  const res={}; Object.keys(RQS).forEach(k=>res[k]={asked:0,total:0});
  ALL.filter(visible).forEach(p=>p.rq.forEach(r=>{res[r].total++; if(P(p.id).asked) res[r].asked++;}));
  return res;
}
function totals(){
  const v=ALL.filter(visible); return {asked:v.filter(p=>P(p.id).asked).length,total:v.length,
    missedStars:v.filter(p=>p.star&&!P(p.id).asked)};
}
function suggestions(){
  const out=[], cov=coverage(), tot=totals();
  Object.entries(cov).forEach(([k,c])=>{ if(c.total && c.asked/c.total<.5){
    const stars=ALL.filter(p=>visible(p)&&p.star&&p.rq.includes(k)).map(p=>p.id).join(", ");
    out.push(`${k} ${RQS[k]} is thin in this interview (${c.asked}/${c.total} prompts). In the next one, prioritise ${stars||"its prompts"} early.`);}});
  if(tot.missedStars.length) out.push(`Priority prompts not covered: ${tot.missedStars.map(p=>p.id).join(", ")}. Mark them as gaps in the debrief so synthesis knows.`);
  const q=S.log.filter(e=>e.kind==="quote").length;
  if(q===0) out.push("No hot quotes captured. Pull 3 verbatim lines with timestamps from the recording before writing the transcript.");
  else if(q<3) out.push(`Only ${q} hot quote${q>1?"s":""}. Add more from the recording while memory is fresh.`);
  if(!S.log.some(e=>e.kind==="nonverbal")) out.push("No non-verbal cues noted. Next time, mark sighs, pauses and laughter: they show where the emotion is.");
  STAGES.forEach(s=>{ const t=(S.stageTime[s.id]||0)/60; if(t>s.plan*1.3) out.push(`Stage ${s.n} ran ${Math.round(t)} min against a plan of ${s.plan}. Trim or tighten it next time.`);});
  const general=ALL.filter(p=>/\b(usually|always|normally|generally|siempre|normalmente|suelo)\b/i.test(P(p.id).note)).length;
  if(general>=2) out.push(`Generalisations showed up in ${general} answers. Ask for “the last time” sooner.`);
  if(S.path==="B") out.push("Path B participant: in synthesis, compare with Path A stories and note at which step the decision stopped.");
  const hypDone=Object.values(S.hyps).filter(h=>h&&h.v).length;
  if(hypDone<HYPS.length) out.push(`Rate all hypotheses (${hypDone}/${HYPS.length} done). Look for evidence against them too.`);
  if(!S.recontact) out.push("Record whether the participant agreed to be recontacted for the sprint.");
  out.push("Upload the audio, transcript and timeline photo within 48 hours, with names removed.");
  return out;
}

function renderStart(){

  $("#view-start").innerHTML=`
  <div class="start-hero">

             :`<button class="btn primary big" data-goto="setup">Start an interview →</button>`}

function steps(){
  const out=[];
  STAGES.forEach(s=>{
    const list=[];
    if(s.script) list.push({kind:"script",id:s.id+"-open",title:"Opening script",lines:s.script});
    if(s.timeline) list.push({kind:"setup",id:s.id+"-tl",title:"Set up the timeline and choose the path"});
    s.prompts.filter(visible).forEach(p=>list.push({kind:"prompt",id:p.id,p}));
    if(s.closing) list.push({kind:"closing",id:s.id+"-close",title:"Closing script and recontact",lines:s.closing});
    list.forEach((st,i)=>{ st.stage=s.id; st.at=STAGE_START[s.id]+(i+.5)/list.length*s.plan; out.push(st); });
  });
  return out;
}

/* ---------------- guides: data model ---------------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const GKEY="ifg-guides-v1";
function scriptObj(arr){ if(!arr) return {en:"",es:""}; return {en:arr.filter(l=>!l.startsWith("ES: ")).join("\n\n"), es:arr.filter(l=>l.startsWith("ES: ")).map(l=>l.slice(4)).join("\n\n")}; }
function buildDefaultGuide(){
  return { id:"default", builtin:true, name:"Class guide (default)", author:"ELISAVA team", updatedAt:0,
    study:{ q:"¿Cómo puede ELISAVA ofrecer formatos de aprendizaje que se adapten a los horarios laborales, los ritmos y las necesidades de los profesionales creativos en España de entre 21 y 45 años?",
      who:"creative professionals, 21-45, working in Spain", focus:"fitting learning into a creative working life", method:"semi-structured interview, about 50 min" },
    rqs: DEF_RQ_DETAIL.map(r=>({k:r.k,t:r.t,q:r.q,listen:r.listen})),
    hyps: DEF_HYPS.map(([k,t])=>({k,t})),
    stages: DEF_STAGES.map(st=>({ id:st.id, title:st.title, goal:st.goal, plan:st.plan, range:(DEF_ARC[st.id]||{}).range||"", timeline:!!st.timeline,
      key:((DEF_ARC[st.id]||{}).key||[]).slice(), script:scriptObj(st.script), closing:scriptObj(st.closing),
      prompts: st.prompts.map(p=>({ id:p.id, en:p.en, es:p.es, probe:p.probe, tip:p.tip, rq:(p.rq||[]).slice(), star:!!p.star, path:p.path||(st.timeline?"A":""), stop:DEF_STOPS[p.id]||"" })) })) };
}
function toLines(o){ if(!o) return null; const out=[]; if((o.en||"").trim()) out.push(o.en.trim()); if((o.es||"").trim()) out.push("ES: "+o.es.trim()); return out.length?out:null; }
function applyGuide(g){
  ACTIVE=g;
  STUDY=g.study||{};
  RQ_DETAIL=(g.rqs||[]).map(r=>({...r}));
  RQS=Object.fromEntries(RQ_DETAIL.map(r=>[r.k,r.t]));
  HYPS=(g.hyps||[]).map(h=>[h.k,h.t]);
  STAGES=(g.stages||[]).map((st,i)=>({ id:st.id, n:String(i+1), title:st.title||("Stage "+(i+1)), goal:st.goal||"", plan:Math.max(1,+st.plan||1), timeline:!!st.timeline,
    script:toLines(st.script), closing:toLines(st.closing),
    prompts:(st.prompts||[]).map(p=>({ id:p.id, en:p.en||"", es:p.es||"", probe:p.probe||"", tip:p.tip||"", rq:(p.rq||[]).filter(r=>RQS[r]), star:!!p.star, path: st.timeline?(p.path||"A"):undefined })) }));
  ALL=STAGES.flatMap(s=>s.prompts.map(p=>({...p,stage:s.id})));
  ARC=Object.fromEntries((g.stages||[]).map(st=>[st.id,{range:st.range||"",key:(st.key||[]).slice()}]));
  STOPS={}; (g.stages||[]).forEach(st=>(st.prompts||[]).forEach(p=>{ if(p.stop) STOPS[p.id]=p.stop; }));
  TOTAL=Math.max(1,STAGES.reduce((a,s)=>a+s.plan,0));
  STAGE_START={}; let t=0; STAGES.forEach(s=>{STAGE_START[s.id]=t; t+=s.plan;});
}
function localGuides(){ try{ const a=JSON.parse(localStorage.getItem(GKEY)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function setLocalGuides(a){ try{ localStorage.setItem(GKEY,JSON.stringify(a)); }catch(e){} }
function mergeGuides(remote){
  const map=new Map(); [...localGuides(),...(remote||[])].forEach(g=>{ if(!g||!g.id||g.builtin) return; const o=map.get(g.id); if(!o||(g.updatedAt||0)>=(o.updatedAt||0)) map.set(g.id,g); });
  [...(GUIDES_DELETED||[])].forEach(id=>map.delete(id));
  const list=[...map.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  setLocalGuides(list); GUIDES=[DEFAULT_GUIDE,...list]; renderGuideSel();
}
let GUIDES_DELETED=new Set();
function findGuide(id){ return GUIDES.find(g=>g.id===id); }
async function loadTeamGuides(){
  try{
    if(db){ const snap=await db.collection("guides").get(); mergeGuides(snap.docs.map(d=>d.data())); }
    else if(api){ const d=await apiCall("GET","?kind=guide"); mergeGuides(d.items||[]); }
    else mergeGuides([]);
  }catch(e){ mergeGuides([]); }
  if(view==="editor") renderEditor();
}
async function saveGuideRemote(g){
  if(db){ await db.collection("guides").doc(g.id).set(clone(g)); return "team"; }
  if(api){ await apiCall("POST","?kind=guide",g); return "team"; }
  return "local";
}
async function deleteGuideRemote(id){
  if(db){ await db.collection("guides").doc(id).delete(); return; }
  if(api){ await apiCall("DELETE","?kind=guide&id="+encodeURIComponent(id)); }
}
function useGuide(g,quiet){
  S.guide=clone(g); S.guideId=g.id; applyGuide(S.guide);
  if(!steps().some(x=>x.id===S.cur)){ S.cur=""; S.stage=STAGES[0]?.id||""; }
  persist(); renderGuideSel();
  if(!quiet) toast("Using guide: "+g.name);
  ({start:renderStart,setup:renderSetup,interview:renderInterview,review:renderReview,library:renderLibrary,editor:renderEditor})[view]?.();
}
function renderGuideSel(){
  const sel=$("#guideSel"); if(!sel) return;
  const cur=S.guideId||"default";
  const own=GUIDES.filter(g=>!g.builtin);
  const outdated=S.guide&&findGuide(cur)&&(findGuide(cur).updatedAt||0)>(S.guide.updatedAt||0);
  sel.innerHTML=`<option value="default" ${cur==="default"?"selected":""}>${esc(DEFAULT_GUIDE.name)}</option>`+
    (own.length?`<optgroup label="Team guides">${own.map(g=>`<option value="${esc(g.id)}" ${g.id===cur?"selected":""}>${esc(g.name)}${g.author?" · "+esc(g.author):""}</option>`).join("")}</optgroup>`:"")+
    (S.guide&&!findGuide(cur)?`<option value="${esc(cur)}" selected>${esc(S.guide.name||"Guide")} (this interview)</option>`:"")+
    `<optgroup label="Actions"><option value="__edit">✎ Edit guides…</option><option value="__new">+ New guide (copy of current)</option></optgroup>`;
  sel.title=outdated?"A newer version of this guide was saved by the team":"";
  $("#guidePick")?.classList.toggle("outdated",!!outdated);
}

function newGuideFrom(src,blankOne){
  const g=blankOne?{ study:{q:"",who:"",focus:"",method:""}, rqs:[{k:"RQ1",t:"",q:"",listen:""}], hyps:[],
      stages:[{id:"s"+Date.now().toString(36),title:"Stage 1",goal:"",plan:10,range:"",timeline:false,key:[],script:{en:"",es:""},closing:{en:"",es:""},prompts:[blankPrompt("1.1")]}] } : clone(src);
  g.id="g-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  g.builtin=false; g.name=blankOne?"New guide":("Copy of "+(src.name||"guide")).replace("Copy of Class guide (default)","My guide"); g.author=S.interviewer||""; g.updatedAt=0;
  return g;
}
function promptsOf(g){ return (g?.stages||[]).flatMap(st=>(st.prompts||[]).map(p=>({...p,path:st.timeline?(p.path||"A"):undefined}))); }
function blankPrompt(id){ return {id,en:"",es:"",probe:"",tip:"",rq:[],star:false,path:"A",stop:""}; }
function setPath(o,path,v){ const k=path.split("."); let x=o; for(let i=0;i<k.length-1;i++){ x=x[/^\d+$/.test(k[i])?+k[i]:k[i]]; } x[/^\d+$/.test(k.at(-1))?+k.at(-1):k.at(-1)]=v; }
function markDirty(){ EDIT_DIRTY=true; const st=$("#edStatus"); if(st){ st.className="status"; st.textContent="Unsaved changes"; } }
function nextPromptId(si){ const n=si+1; let i=(EDIT.stages[si].prompts.length)+1; const ids=new Set(EDIT.stages.flatMap(s=>s.prompts.map(p=>p.id))); while(ids.has(n+"."+i)) i++; return n+"."+i; }
function validateGuide(g){
  const errs=[];
  if(!(g.name||"").trim()) errs.push("Give the guide a name.");
  if(!g.stages.length) errs.push("Add at least one stage.");
  const ids=new Set();
  g.stages.forEach((st,si)=>{ if(!(st.title||"").trim()) errs.push(`Stage ${si+1} needs a title.`);
    if(!st.prompts.length) errs.push(`Stage ${si+1} needs at least one question.`);
    st.prompts.forEach(p=>{ p.id=(p.id||"").trim(); if(!/^[A-Za-z0-9.]{1,12}$/.test(p.id)) errs.push(`Question ID “${p.id||"empty"}” in stage ${si+1}: use letters, digits and dots only.`);
      else if(ids.has(p.id)) errs.push(`Question ID ${p.id} is used twice.`); ids.add(p.id);
      if(!(p.en||"").trim()&&!(p.es||"").trim()) errs.push(`Question ${p.id||"?"} has no text.`); }); });
  const ks=new Set(); g.rqs.forEach((r,i)=>{ r.k=(r.k||"").trim(); if(!r.k) errs.push(`Research question ${i+1} needs a code (e.g. RQ${i+1}).`); else if(ks.has(r.k)) errs.push(`Research question code ${r.k} is used twice.`); ks.add(r.k); });
  return errs;
}

}

async function editorAction(b){
  const a=b.dataset.edact, si=+b.dataset.si, pi=+b.dataset.pi;
  const keepOpen=()=>{ renderEditor._open=isNaN(si)?renderEditor._open:si; };
  if(a==="dup"||a==="blank"){ if(EDIT_DIRTY&&!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Discard unsaved changes?"; return; }
    EDIT=newGuideFrom(ACTIVE,a==="blank"); EDIT_DIRTY=true; renderEditor._open=0; renderEditor(); toast(a==="blank"?"Empty guide created. Save it when ready.":"Copy created. Edit it and press Save."); return; }
  if(!EDIT) return;
  const st=EDIT.stages[si];
  if(a==="qadd"){ st.prompts.push(blankPrompt(nextPromptId(si))); keepOpen(); }
  else if(a==="qdel"){ const [p]=st.prompts.splice(pi,1); st.key=(st.key||[]).filter(k=>k!==p.id); keepOpen(); }
  else if(a==="qup"&&pi>0){ [st.prompts[pi-1],st.prompts[pi]]=[st.prompts[pi],st.prompts[pi-1]]; keepOpen(); }
  else if(a==="qdown"&&pi<st.prompts.length-1){ [st.prompts[pi+1],st.prompts[pi]]=[st.prompts[pi],st.prompts[pi+1]]; keepOpen(); }
  else if(a==="sadd"){ const n=EDIT.stages.length+1; EDIT.stages.push({id:"s"+Date.now().toString(36),title:"Stage "+n,goal:"",plan:10,range:"",timeline:false,key:[],script:{en:"",es:""},closing:{en:"",es:""},prompts:[]}); EDIT.stages.at(-1).prompts.push(blankPrompt(nextPromptId(n-1))); renderEditor._open=n-1; }
  else if(a==="sdel"){ if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Click again to remove the stage"; return; } EDIT.stages.splice(si,1); renderEditor._open=-1; }
  else if(a==="sup"&&si>0){ [EDIT.stages[si-1],EDIT.stages[si]]=[EDIT.stages[si],EDIT.stages[si-1]]; renderEditor._open=si-1; }
  else if(a==="sdown"&&si<EDIT.stages.length-1){ [EDIT.stages[si+1],EDIT.stages[si]]=[EDIT.stages[si],EDIT.stages[si+1]]; renderEditor._open=si+1; }
  else if(a==="rqadd"){ let i=EDIT.rqs.length+1; const ks=new Set(EDIT.rqs.map(r=>r.k)); while(ks.has("RQ"+i)) i++; EDIT.rqs.push({k:"RQ"+i,t:"",q:"",listen:""}); }
  else if(a==="rqdel"){ const [r]=EDIT.rqs.splice(+b.dataset.ri,1); EDIT.stages.forEach(s=>s.prompts.forEach(p=>p.rq=(p.rq||[]).filter(k=>k!==r.k))); }
  else if(a==="hadd"){ let i=EDIT.hyps.length+1; const ks=new Set(EDIT.hyps.map(h=>h.k)); while(ks.has("H"+i)) i++; EDIT.hyps.push({k:"H"+i,t:""}); }
  else if(a==="hdel"){ EDIT.hyps.splice(+b.dataset.hi,1); }
  else if(a==="del"){ $("#edDelConfirm").hidden=false; return; }
  else if(a==="delno"){ $("#edDelConfirm").hidden=true; return; }
  else if(a==="delyes"){ const id=EDIT.id; try{ if(EDIT.updatedAt) await deleteGuideRemote(id); }catch(e){ toast("Could not delete on the server. Try again."); return; }
    GUIDES_DELETED.add(id); setLocalGuides(localGuides().filter(g=>g.id!==id)); mergeGuides(GUIDES.filter(g=>!g.builtin&&g.id!==id));
    if(S.guideId===id) toast("Deleted. Your current interview keeps its own copy of the guide.");
    else toast("Guide deleted"); EDIT=null; EDIT_DIRTY=false; renderEditor(); return; }
  else if(a==="save"||a==="use"){
    const errs=validateGuide(EDIT); const stEl=$("#edStatus");
    if(errs.length){ stEl.className="status err"; stEl.textContent=errs.slice(0,3).join(" "); return; }
    EDIT.stages.forEach(s=>{ const ids=new Set(s.prompts.map(p=>p.id)); s.key=(s.key||[]).filter(k=>ids.has(k)); s.plan=Math.max(1,+s.plan||1); });
    if(a==="save"){
      EDIT.updatedAt=Date.now(); EDIT.builtin=false; stEl.className="status"; stEl.textContent="Saving…";
      let where="local";
      try{ where=await saveGuideRemote(EDIT); }
      catch(e){ stEl.className="status err"; stEl.textContent= e.code==="bad_code" ? "The team code is missing or wrong. Enter it under Setup, then save again." : "Could not reach the team archive. The guide is kept in this browser; try again in a moment."; where="failed"; }
      GUIDES_DELETED.delete(EDIT.id); setLocalGuides([...localGuides().filter(g=>g.id!==EDIT.id),clone(EDIT)]); mergeGuides(GUIDES.filter(g=>!g.builtin).filter(g=>g.id!==EDIT.id).concat([clone(EDIT)]));
      EDIT_DIRTY=false;
      if(where!=="failed"){ stEl.className="status ok"; stEl.textContent= where==="team" ? "Saved for the team. Everyone sees it in the Guide menu." : "Saved in this browser."; }
      if(S.guideId===EDIT.id){ useGuide(EDIT,true); }
      return;
    }
    useGuide(clone(EDIT)); toast(EDIT_DIRTY?"Using this version for your interview. Remember to save it for the team.":"Using this guide for your interview"); return;
  }
  markDirty(); renderEditor();
}

const EXTRA_MAP={"ł":"l","Ł":"L","đ":"d","Đ":"D","ø":"o","Ø":"O","ß":"ss","ı":"i","′":"'","−":"-"};
const WINANSI_OK="“”‘’–—…•€ŠšŽžŒœŸ‚„†‡‰‹›™ƒˆ˜";
function translit(t){ return String(t).replace(/[łŁđĐøØßı]/g,c=>EXTRA_MAP[c]).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function pdfSafe(t){ let out=""; for(const ch of String(t)){ const c=ch.codePointAt(0);
  if(c<=255||WINANSI_OK.includes(ch)) out+=ch; else if(EXTRA_MAP[ch]) out+=EXTRA_MAP[ch];
  else { const b=ch.normalize("NFD").replace(/[\u0300-\u036f]/g,""); out+= (b&&b.codePointAt(0)<=255)?b:""; } } return out; }
function buildPDF(R){

  const W=595, M=48, CW=W-M*2; let y=M;

  const clean=s=>pdfSafe(String(s??"").replace(/[★→]/g,m=>m==="→"?"->":"*"));
  const need=h=>{ if(y+h>842-M){ doc.addPage(); y=M; } };
  const text=(s,{size=10,bold=false,italic=false,color=ink,gap=4,indent=0}={})=>{
    doc.setFont("helvetica",bold?(italic?"bolditalic":"bold"):(italic?"italic":"normal")); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(clean(s),CW-indent); const lh=size*1.35;
    lines.forEach(l=>{ need(lh); doc.text(l,M+indent,y+size); y+=lh; }); y+=gap; };
  const rule=()=>{ need(10); doc.setDrawColor(230,230,234); doc.line(M,y,W-M,y); y+=10; };
  // header band
  doc.setFillColor(43,43,41); doc.rect(0,0,W,96,"F"); doc.setFillColor(230,240,60); doc.rect(0,96,W,5,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text("ELISAVA DESIGN RESEARCH CHALLENGE  ·  INTERVIEW RECORD",M,34);
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text(doc.splitTextToSize(clean(R.title||"Untitled interview"),CW)[0],M,60);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(clean([R.code,R.interviewer,R.date].filter(Boolean).join("  ·  ")),M,80);
  y=120;
  const meta=[["Guide",(R.guide&&R.guide.name)||"Class guide (default)"],["Interviewer",R.interviewer],["Note-taker",R.noteTaker||"-"],["Date",R.date],["Participant",R.code||"-"],["Profile",R.profile||"-"],["Setting",`${R.setting} · ${R.language}`],["Path",R.path==="B"?"B (no structured learning)":"A (learning experience)"],["Duration",fmt(R.elapsed)],["Recontact",R.recontact||"Not recorded"]];
  meta.forEach(([k,v])=>{ doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...grey); need(14); doc.text(k.toUpperCase(),M,y+9);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...ink); const l=doc.splitTextToSize(clean(v),CW-110); l.forEach((x,i)=>{need(13); doc.text(x,M+110,y+9); y+=13;}); y+=2; });
  y+=6; rule();
  const vis=p=>!p.path||p.path==="both"||p.path===R.path;
  STAGES.forEach(s=>{
    need(40); text(`STAGE ${s.n}  ·  ${s.title.toUpperCase()}`,{size:12,bold:true,color:violet,gap:2});
    text(`Time on stage ${fmt(R.stageTime?.[s.id]||0)} of ${s.plan}:00 planned`,{size:8.5,color:grey,gap:8});
    s.prompts.filter(vis).forEach(p=>{ const st=R.prompts?.[p.id]||{};
      need(30); text(`${st.asked?"[x]":"[ ]"}  ${p.id}${p.star?" *":""}  ${p.en}`,{size:10,bold:true,gap:2});
      text(st.note&&st.note.trim()?st.note:"No notes.",{size:10,italic:!st.note,color:st.note?ink:grey,indent:22,gap:8}); });
    y+=4; });
  rule();
  [["quote","Hot quotes"],["nonverbal","Non-verbal cues"],["memo","Analytic memos"]].forEach(([k,l])=>{
    const items=(R.log||[]).filter(e=>e.kind===k); need(30); text(l.toUpperCase(),{size:11,bold:true,color:violet,gap:4});
    if(!items.length) text("None captured.",{italic:true,color:grey,gap:8});
    items.forEach(e=>text(`[${e.t} · S${e.stage.slice(1)}]  ${k==="quote"?"“"+e.text+"”":e.text}`,{gap:4})); y+=6; });
  rule();
  text("HYPOTHESES",{size:11,bold:true,color:violet});
  HYPS.forEach(([k,l])=>{ const h=R.hyps?.[k]||{}; text(`${k}  ${h.v||"Not rated"}`,{bold:true,gap:1}); text(l,{size:9,color:grey,gap:1}); if(h.e) text(h.e,{indent:14,gap:6}); else y+=5; });
  rule();
  text("DEBRIEF",{size:11,bold:true,color:violet});
  DEBRIEF.forEach(([k,l])=>{ text(l,{bold:true,gap:1}); text(R.debrief?.[k]||"-",{gap:8}); });
  const keep=S; S=R; const sug=suggestions(); S=keep;
  rule(); text("TIPS FOR THE NEXT INTERVIEW",{size:11,bold:true,color:violet});
  sug.forEach(s=>text("- "+s,{gap:3}));
  if(R.ai){ y+=6; rule(); text("COACHING FROM CLAUDE (second opinion)",{size:11,bold:true,color:violet}); text(R.ai,{size:9.5}); }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...grey);
    doc.text(clean(`${R.code||""} ${R.title||""}`).trim().slice(0,80),M,842-24); doc.text(`${i} / ${n}`,W-M,842-24,{align:"right"}); }
  return doc;
}
async function downloadPDF(R){
  if(!window.jspdf){ toast("The PDF library did not load. Check your connection and reload."); return; }
  const name=[R.date,R.code||R.title,R.interviewer].filter(Boolean).map(translit).join("_").replace(/[^\w\-]+/g,"-").replace(/-+/g,"-").slice(0,90)+".pdf";
  const prevG=ACTIVE; let blob; applyGuide(R.guide||DEFAULT_GUIDE); try{ blob=buildPDF(R).output("blob"); } finally{ applyGuide(prevG); }
  if(dlCap){ try{ await dlCap.save({filename:name,data:blob}); toast("PDF saved"); }
    catch(err){ if(err&&err.code!=="declined") toast("The PDF could not be saved here."); } return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------------- AI coaching ---------------- */
async function coach(btn){
  const out=$("#aiOut"); btn.disabled=true; out.hidden=false; out.textContent="Thinking…";
  const notes=ALL.filter(visible).map(p=>`${p.id} ${P(p.id).asked?"[asked]":"[not asked]"} ${p.en}\nNotes: ${P(p.id).note||"-"}`).join("\n\n");
  const caps=S.log.map(e=>`${KIND[e.kind]} [${e.t}]: ${e.text}`).join("\n")||"-";
  const ask=`You are a senior qualitative design researcher coaching a Master's student after a semi-structured interview. The study: how creative professionals in Spain (21-45) fit learning into working life. Research questions: RQ1 triggers & goals, RQ2 fit & continuity, RQ3 choosing & valuing, RQ4 applying & proving. Method rules: ask about specific past events, never leading or hypothetical questions, ladder to values.

Interview notes:
${notes}

Captures:
${caps}

Write plain text, no markdown symbols, in English, under 250 words, with these four short sections:
1. Strongest stories (2-3 bullets, cite prompt ids)
2. Follow-ups they missed (3 concrete questions to ask if they recontact, in English and Spanish)
3. Interviewing habits to adjust (based on how the notes read, e.g. generalisations not pushed)
4. Change to the guide for the next interview (1-2 items)
Do not invent facts that are not in the notes.`;
  try{ const r=await sampleCap(ask,{onText:({text})=>{out.textContent=text;}}); S.ai=r.text; out.textContent=r.text; persist(); }
  catch(err){ if(err&&err.code==="not_granted"){ $("#aiPanel").hidden=true; } else out.textContent= err&&err.code==="rate_limited"?"Too many requests right now. Try again in a minute.":"Coaching is not available right now."; if(!S.ai) out.hidden= err&&err.code==="not_granted"; }
  btn.disabled=false;
}

/* ---------------- boot ---------------- */
function setHdr(){ const h=document.querySelector(".bar"); if(h) document.documentElement.style.setProperty("--hdr",(h.offsetHeight+6)+"px"); }
window.addEventListener("resize",setHdr); setTimeout(setHdr,0); setTimeout(setHdr,800);
DEFAULT_GUIDE=buildDefaultGuide(); GUIDES=[DEFAULT_GUIDE,...localGuides().filter(g=>g&&g.id&&!g.builtin)];
if(!S.guide||S.guideId==="default"||!S.guideId){ S.guide=clone(DEFAULT_GUIDE); S.guideId="default"; }
applyGuide(S.guide); renderGuideSel();
window.addEventListener("beforeunload",e=>{ if(EDIT_DIRTY){ e.preventDefault(); e.returnValue=""; } });
sessLine(); $("#clock").textContent=fmt(S.elapsed); if(S.elapsed>0) $("#timerBtn").textContent="Resume";
setTab("start");
(async()=>{
  if(!window.claude||!window.claude.use){
    try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),4000);
      for(const c of API_CANDIDATES){ try{ const r=await fetch(c+"?ping=1",{cache:"no-store",signal:ctl.signal});
          const j=r.ok?await r.json().catch(()=>null):null; if(j&&j.ok){ API_URL=c; api=true; break; } }catch(e){} }
      clearTimeout(t); }catch(e){ api=false; }
    libState=api?"loading":"none";
    if(api){ apiLoad(); if(view==="setup") renderSetup(); }
    loadTeamGuides();
    if(view==="library") renderLibrary(); return; }
  const [d,dl,sm,u]=await Promise.all(["db","downloads","sample","user"].map(n=>window.claude.use(n).catch(()=>null)));
  db=d; dlCap=dl; sampleCap=sm; userCap=u;
  try{ myId=u? await u.id():null; }catch(e){}
  if(view==="review") renderReview();
  loadTeamGuides();
  if(db){ db.collection("interviews").orderBy("updatedAt","desc").limit(200).onSnapshot(snap=>{
      library=snap.docs.map(x=>x.data()).filter(Boolean); libState="ready"; if(view==="library") renderLibrary(); },
    ()=>{ libState="ready"; if(view==="library") renderLibrary(); }); }
  else if(view==="library") renderLibrary();
})();
